# coturn TURN relay for WebRTC calls behind strict NATs/firewalls.
# The API issues short-lived credentials using the shared secret (TURN REST API).
listening-port=3478
tls-listening-port=5349
fingerprint
use-auth-secret
static-auth-secret=CHANGE_ME_SAME_AS_TURN_SECRET
realm=turn.example.com
total-quota=200
stale-nonce=600
no-multicast-peers
no-cli
# Relay port range (open these UDP ports in the firewall)
min-port=49160
max-port=49200
# For TLS (turns:) provide certificates:
# cert=/etc/coturn/fullchain.pem
# pkey=/etc/coturn/privkey.pem
# Block relaying to private networks (SSRF protection)
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
