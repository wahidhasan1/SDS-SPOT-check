# Local services for development. Start with: docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fluent
      POSTGRES_PASSWORD: fluent_dev_pw
      POSTGRES_DB: fluent
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the fluent_test database used by the API test suite.
      - ./scripts/db-init.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro

  # Optional TURN relay for voice calls across restrictive networks.
  # Set TURN_URLS=turn:<public-host>:3478 and TURN_SECRET=change-me in .env.
  coturn:
    image: coturn/coturn:4.6
    profiles: [turn]
    network_mode: host
    command: ["-n", "--listening-port=3478", "--use-auth-secret", "--static-auth-secret=change-me", "--realm=fluentpath", "--no-cli", "--fingerprint"]

volumes:
  pgdata:
