# Local/full-stack deployment: Postgres + API (with OCR) + web + TURN relay.
#   cp apps/server/.env.example apps/server/.env   # then fill in secrets
#   docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: fluentpath
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      retries: 10

  api:
    build: { context: ., dockerfile: apps/server/Dockerfile }
    env_file: apps/server/.env
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/fluentpath
    depends_on:
      db: { condition: service_healthy }
    ports: ["4000:4000"]
    volumes: [media-uploads:/app/apps/server/media/uploads]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
    ports: ["8080:80"]

  turn:
    image: coturn/coturn:4.6
    network_mode: host
    volumes: [./deploy/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro]
    profiles: [turn]

volumes:
  dbdata:
  media-uploads:
