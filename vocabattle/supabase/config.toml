# Supabase CLI configuration for local development (`supabase start`).
# Production settings (redirect URLs, SMTP, OAuth providers) are configured in
# the Supabase dashboard — see docs/SETUP.md.
project_id = "vocabattle"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[realtime]
enabled = true

[auth]
enabled = true
site_url = "vocabattle://"
additional_redirect_urls = ["vocabattle://**", "exp://**", "http://localhost:8081/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true

[auth.rate_limit]
email_sent = 4
sign_in_sign_ups = 30
token_refresh = 150
